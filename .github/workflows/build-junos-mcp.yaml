name: Junos MCP Container Image

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/juniper/junos-mcp-server
  TEST_IMAGE: local/junos-mcp-server:test

jobs:
  resolve-source:
    name: Resolve upstream source
    runs-on: ubuntu-24.04
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Resolve Junos MCP HEAD
        id: source
        shell: bash
        run: |
          source_sha="$(git ls-remote https://github.com/Juniper/junos-mcp-server.git HEAD | awk '{print $1}')"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate ${{ matrix.platform }}
    needs: resolve-source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Junos MCP source
        uses: actions/checkout@v6.0.2
        with:
          repository: Juniper/junos-mcp-server
          ref: ${{ needs.resolve-source.outputs.source-sha }}
          path: junos-mcp-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build validation image
        uses: docker/build-push-action@v7.3.0
        with:
          context: junos-mcp-server
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.TEST_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/Juniper/junos-mcp-server
            org.opencontainers.image.revision=${{ needs.resolve-source.outputs.source-sha }}
          cache-from: type=gha,scope=junos-validate-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=junos-validate-${{ matrix.architecture }}

      - name: Smoke-test Junos MCP runtime
        run: |
          docker run --rm --entrypoint sh "${TEST_IMAGE}" -ec '
            python -c "import jnpr.junos, jxmlease, mcp, ncclient, psutil, uvicorn"
            test -s /app/jmcp.py
          '

      - name: Scan HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: json
          output: trivy-junos-mcp-${{ matrix.architecture }}.json
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-junos-mcp-${{ matrix.architecture }}
          path: trivy-junos-mcp-${{ matrix.architecture }}.json
          if-no-files-found: warn
          retention-days: 14

  publish-platform:
    name: Publish ${{ matrix.platform }} digest
    needs: [resolve-source, validate]
    if: >-
      github.repository == 'Juniper/nita' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Junos MCP source
        uses: actions/checkout@v6.0.2
        with:
          repository: Juniper/junos-mcp-server
          ref: ${{ needs.resolve-source.outputs.source-sha }}
          path: junos-mcp-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: junos-mcp-server
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/Juniper/junos-mcp-server
            org.opencontainers.image.revision=${{ needs.resolve-source.outputs.source-sha }}
            org.opencontainers.image.description=Junos MCP server built for NITA
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=junos-publish-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=junos-publish-${{ matrix.architecture }}

      - name: Smoke-test published platform digest
        env:
          PUBLISHED_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "${PUBLISHED_IMAGE}"
          docker run --rm --entrypoint sh "${PUBLISHED_IMAGE}" -ec '
            python -c "import jnpr.junos, jxmlease, mcp, ncclient, psutil, uvicorn"
            test -s /app/jmcp.py
          '

      - name: Scan published platform digest
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-published-junos-mcp-${{ matrix.architecture }}.json
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload published-digest vulnerability report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-published-junos-mcp-${{ matrix.architecture }}
          path: trivy-published-junos-mcp-${{ matrix.architecture }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Export digest marker
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest marker
        uses: actions/upload-artifact@v7.0.1
        with:
          name: junos-digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish multi-platform manifest
    needs: [resolve-source, publish-platform]
    if: >-
      github.repository == 'Juniper/nita' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digest markers
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: junos-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and inspect manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source-sha }}
        run: |
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f | sort)
          test "${#digest_files[@]}" -eq 2

          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:$(basename "${digest_file}")")
          done

          immutable_tag="source-${SOURCE_SHA:0:12}-run-${GITHUB_RUN_ID}"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${immutable_tag}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${immutable_tag}"
